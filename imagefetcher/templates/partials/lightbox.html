<div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Image preview">
  <button id="lb-prev" class="btn-icon lb-nav" type="button" aria-label="Previous image"></button>
  <figure class="lb-stage">
    <div id="lb-imgwrap" class="lb-imgwrap"><img id="lb-img" alt=""></div>
    <figcaption class="lb-cap">
      <div class="lb-text"><strong id="lb-name"></strong><span id="lb-meta"></span></div>
      <div class="lb-actions">
        <button id="lb-select" class="btn btn-ghost btn-sm" type="button"></button>
        <button id="lb-copy" class="btn btn-ghost btn-sm" type="button">Copy URL</button>
        <a id="lb-download" class="btn btn-ghost btn-sm" href="#">Download</a>
        <a id="lb-open" class="btn btn-ghost btn-sm" href="#" target="_blank" rel="noopener noreferrer">Original</a>
        <button id="lb-close" class="btn btn-primary btn-sm" type="button">Close</button>
      </div>
    </figcaption>
  </figure>
  <button id="lb-next" class="btn-icon lb-nav" type="button" aria-label="Next image"></button>
</div>
